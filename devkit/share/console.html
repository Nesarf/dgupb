<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>devkit 控制台</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e6e9ef;--dim:#8b93a7;--acc:#6ea8fe;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Noto Sans SC",sans-serif}
h1{font-size:1.05rem;margin:0 0 3px}
.sub{color:var(--dim);font-size:.8rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.tool{border:1px solid var(--line);border-radius:9px;padding:7px 8px;text-align:center;font-size:.82rem;background:#12151b;color:var(--fg);cursor:pointer}
.tool.on{border-color:#2f4a35}
.tool.off{opacity:.35;cursor:not-allowed}
.tool.sel{border-color:var(--acc);background:#1b2333}
input,button{font:inherit;border-radius:9px;border:1px solid var(--line);background:#12151b;color:var(--fg);padding:9px 11px}
input{flex:1;min-width:120px}
button.primary{background:var(--acc);border-color:var(--acc);color:#0b1020;font-weight:600}
button:disabled{opacity:.45}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 ui-monospace,Menlo,monospace;max-height:46vh;overflow:auto}
.meta{color:var(--dim);font-size:.78rem;margin-bottom:6px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
</style></head><body>
<h1>devkit 控制台</h1>
<div class="sub" id="sub">连接中…</div>

<div class="card">
  <div class="meta">工具（点一下填进命令）</div>
  <div class="tools" id="tools"></div>
</div>

<div class="card">
  <div class="row">
    <input id="arg" placeholder="参数，例如 -h 或 /path/to/project" autocomplete="off">
    <button class="primary" id="go">运行</button>
  </div>
  <div class="meta" id="hint" style="margin:8px 0 0">选择上面的工具，或直接输入参数后运行</div>
</div>

<div class="card">
  <div class="meta"><span id="res">未运行</span></div>
  <pre id="out">—</pre>
</div>

<script>
let sel = null, tools = {};
const $ = (id) => document.getElementById(id);

async function status() {
  try {
    const r = await fetch('/status', { cache: 'no-store' });
    const j = await r.json();
    tools = j.tools || {};
    $('sub').textContent = 'v' + j.version + ' · 端口 ' + j.port + ' · pid ' + j.pid + ' · uptime ' + j.uptime + 's';
    const box = $('tools');
    box.innerHTML = '';
    for (const [name, ok] of Object.entries(tools)) {
      const b = document.createElement('button');
      b.className = 'tool ' + (ok ? 'on' : 'off') + (sel === name ? ' sel' : '');
      b.textContent = name;
      b.disabled = !ok;
      b.onclick = () => { sel = name; $('hint').textContent = '已选 ' + name; status(); };
      box.appendChild(b);
    }
  } catch (e) {
    $('sub').textContent = '连不上桥：' + e.message;
  }
}

async function run() {
  if (!sel) { $('hint').textContent = '先选一个工具'; return; }
  const arg = $('arg').value.trim();
  $('go').disabled = true;
  $('res').textContent = '运行中…';
  $('out').textContent = '';
  const t0 = Date.now();
  try {
    const q = '/run?cmd=' + encodeURIComponent(sel) + (arg ? '&arg=' + encodeURIComponent(arg) : '');
    const r = await fetch(q, { cache: 'no-store' });
    const j = await r.json();
    const ms = j.ms != null ? j.ms : Date.now() - t0;
    if (j.error) {
      $('res').innerHTML = '<span class="bad">' + j.error + '</span>';
      $('out').textContent = '—';
    } else {
      $('res').innerHTML = '<span class="' + (j.ok ? 'ok' : 'bad') + '">' + sel +
        ' · exit ' + j.exit + ' · ' + ms + ' ms</span>';
      $('out').textContent = j.out || '(无输出)';
    }
  } catch (e) {
    $('res').innerHTML = '<span class="bad">请求失败</span>';
    $('out').textContent = e.message;
  }
  $('go').disabled = false;
}

$('go').onclick = run;
$('arg').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
status();
setInterval(status, 5000);
</script>
</body></html>
