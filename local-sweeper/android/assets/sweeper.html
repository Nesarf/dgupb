<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e8eef4">
<title>扫雷 · 形状提示</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"扫雷 · 形状提示","short_name":"扫雷","display":"standalone","start_url":".","background_color":"#e8eef4","theme_color":"#dde7f0"}'>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; padding-top: env(safe-area-inset-top, 0px); background: #e8eef4; color: #22323f;
    font-family: -apple-system, "Noto Sans CJK SC", "PingFang SC", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 8px 10px 6px; background: #dde7f0; border-bottom: 1px solid #c9d6e2; }
  select, button { font: inherit; font-size: 13px; padding: 5px 9px; border-radius: 8px;
    border: 1px solid #b9c9d8; background: #f7fbfe; color: #22323f; }
  button:active { background: #e3edf5; }
  .stat { margin-left: auto; font-size: 12px; color: #4a6072; white-space: nowrap; }
  #wrap { padding: 6px; display: flex; justify-content: center; overflow-x: auto; }
  canvas { touch-action: none; border-radius: 8px; background: #f4f8fb;
    box-shadow: 0 1px 6px rgba(30,60,90,.12); }
  #msg { text-align: center; font-size: 13px; color: #35566d; padding: 4px 10px 10px; min-height: 22px; }
</style>
</head>
<body>
<header>
  <select id="level">
    <option value="9,9,10">初级 9×9 · 10</option>
    <option value="16,16,40">中级 16×16 · 40</option>
    <option value="16,30,100" selected>高级 16×30 · 100</option>
  </select>
  <button id="newgame">新局</button>
  <select id="density">
    <option value="0">精简</option>
    <option value="1" selected>标准</option>
    <option value="2">全部</option>
  </select>
  <span class="stat" id="stat">准备中…</span>
</header>
<div id="wrap"><canvas id="board"></canvas></div>
<div id="msg">点格子翻开，长按插旗；点已翻开的数字可以连开周围</div>
<script>
const OFFS = {1:[-1,-1],2:[-1,0],3:[-1,1],4:[0,-1],5:[0,1],6:[1,-1],7:[1,0],8:[1,1]};
const SHAPES = {
  up:[1,2,3], down:[6,7,8], left:[1,4,6], right:[3,5,8],
  ul:[1,2,4], ur:[2,3,5], dl:[4,6,7], dr:[5,7,8],
  cross:[1,3,6,8], sq:[3,4,7], mu:[1,3,4,5,6], integ:[2,3,6,7],
  vert:[2,7], dash:[4,5], bs:[1,8], fs:[3,6],
  neq:[2,4,5,7], pm:[1,2,3,6,7,8], mp:[1,2,3,4,5,7], corner:[1,2,3,4],
  tf:[2,6,8], bf:[1,3,7], ang:[3,6,8], lt:[2,4,7], gt:[2,5,7]
};
const DISP = {up:"↑",down:"↓",left:"←",right:"→",ul:"↖",ur:"↗",dl:"↙",dr:"↘",
  cross:"×",sq:"√",mu:"μ",integ:"∫",vert:"∣",dash:"—",bs:"╲",fs:"╱",
  neq:"≠",pm:"±",mp:"∓",corner:"⌐",tf:"∴",bf:"∵",ang:"∠",lt:"〈",gt:"〉"};

function makeRng(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class Board {
  constructor(R,C,m,seed){
    this.R=R; this.C=C; this.m=m; this.seed=seed;
    this.rng=makeRng(seed);
    this.mines=new Set(); this.rev=new Set(); this.known=new Set();
    this.flag=new Set(); this.dead=false; this.placed=false; this.nums=new Map();
  }
  inside(r,c){ return r>=0&&r<this.R&&c>=0&&c<this.C; }
  I(r,c){ return r*this.C+c; }
  RC(i){ return [Math.floor(i/this.C), i%this.C]; }
  nbs(i){
    const [r,c]=this.RC(i), out=[];
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      if(!dr&&!dc) continue;
      if(this.inside(r+dr,c+dc)) out.push(this.I(r+dr,c+dc));
    }
    return out;
  }
  num(i){
    if(this.nums.has(i)) return this.nums.get(i);
    let n=0; for(const j of this.nbs(i)) if(this.mines.has(j)) n++;
    this.nums.set(i,n); return n;
  }
  place(safe){
    const [sr,sc]=this.RC(safe), pool=[];
    for(let r=0;r<this.R;r++)for(let c=0;c<this.C;c++)
      if(Math.max(Math.abs(r-sr),Math.abs(c-sc))>1) pool.push(this.I(r,c));
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(this.rng()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    this.mines=new Set(pool.slice(0,this.m)); this.placed=true; this.nums.clear();
  }
  open(i){
    if(this.rev.has(i)) return;
    if(!this.placed) this.place(i);
    if(this.mines.has(i)){ this.dead=true; this.rev.add(i); return; }
    const st=[i];
    while(st.length){
      const p=st.pop();
      if(this.rev.has(p)||this.mines.has(p)) continue;
      this.rev.add(p);
      if(this.num(p)===0) for(const q of this.nbs(p)) if(!this.rev.has(q)) st.push(q);
    }
  }
  unk(i){ return !this.rev.has(i)&&!this.known.has(i); }
  rest(i){ let n=this.num(i); for(const j of this.nbs(i)) if(this.known.has(j)) n--; return n; }
  localRules(){
    const mi=new Set(), sa=new Set();
    for(const q of this.rev){
      const v=this.num(q); if(!v) continue;
      const hid=[]; for(const p of this.nbs(q)) if(this.unk(p)) hid.push(p);
      if(!hid.length) continue;
      const r=this.rest(q);
      if(r===0) hid.forEach(p=>sa.add(p));
      else if(r===hid.length) hid.forEach(p=>mi.add(p));
    }
    return [mi,sa];
  }
  subsetRules(){
    const mi=new Set(), sa=new Set(), info=new Map();
    for(const q of this.rev){
      if(!this.num(q)) continue;
      const h=new Set(); for(const p of this.nbs(q)) if(this.unk(p)) h.add(p);
      if(h.size) info.set(q,{h,r:this.rest(q)});
    }
    const isSub=(a,b)=>{ for(const x of a) if(!b.has(x)) return false; return true; };
    for(const [a,ia] of info){
      const [ar,ac]=this.RC(a);
      for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){
        if(!dr&&!dc) continue;
        if(!this.inside(ar+dr,ac+dc)) continue;
        const ib=info.get(this.I(ar+dr,ac+dc)); if(!ib) continue;
        let small,big,d;
        if(ia.h.size<ib.h.size&&isSub(ia.h,ib.h)){ small=ia.h; big=ib.h; d=ib.r-ia.r; }
        else if(ib.h.size<ia.h.size&&isSub(ib.h,ia.h)){ small=ib.h; big=ia.h; d=ia.r-ib.r; }
        else continue;
        const diff=[]; for(const x of big) if(!small.has(x)) diff.push(x);
        if(!diff.length) continue;
        if(d===diff.length) diff.forEach(x=>mi.add(x));
        else if(d===0) diff.forEach(x=>sa.add(x));
      }
    }
    return [mi,sa];
  }
  shapeCells(q,key){
    const [r,c]=this.RC(q), out=[];
    for(const id of SHAPES[key]){
      const [dr,dc]=OFFS[id];
      if(this.inside(r+dr,c+dc)) out.push(this.I(r+dr,c+dc));
    }
    return out;
  }
  hintEffect(hints){
    const mi=new Set(), sa=new Set();
    for(const h of hints){
      const cells=this.shapeCells(h.i,h.key).filter(p=>this.unk(p));
      if(!cells.length) continue;
      if(h.lb>=cells.length) cells.forEach(x=>mi.add(x));
      else if(h.lb<=0) cells.forEach(x=>sa.add(x));
    }
    return [mi,sa];
  }
  solve(hints){
    const total=this.R*this.C-this.m; let guard=0;
    while(this.rev.size<total){
      if(guard++>20000) return false;
      let [mi,sa]=this.localRules();
      if(!mi.size&&!sa.size) [mi,sa]=this.subsetRules();
      if(!mi.size&&!sa.size) [mi,sa]=this.hintEffect(hints);
      if(!mi.size&&!sa.size&&this.known.size>=this.m){
        sa=new Set(); for(let i=0;i<this.R*this.C;i++) if(this.unk(i)) sa.add(i);
      }
      const mi2=[...mi].filter(x=>!this.rev.has(x)&&!this.known.has(x));
      const sa2=[...sa].filter(x=>!this.rev.has(x)&&!this.known.has(x));
      if(!mi2.length&&!sa2.length) return false;
      mi2.forEach(x=>this.known.add(x));
      for(const x of sa2){ if(this.mines.has(x)) return false; this.open(x); }
    }
    for(const x of this.mines) this.known.add(x);
    return !this.dead;
  }
  candidates(){
    const out=[];
    for(const q of this.rev){
      const v=this.num(q); if(!v) continue;
      const base=this.rest(q);
      for(const key in SHAPES){
        const cells=this.shapeCells(q,key), set=new Set(cells);
        const unk=cells.filter(p=>this.unk(p));
        if(!unk.length) continue;
        let outside=0;
        for(const p of this.nbs(q)) if(!set.has(p)&&this.unk(p)) outside++;
        const lb=Math.max(0,base-outside);
        if(lb>=unk.length) out.push({i:q,key,lb,n:unk.length,v});
        let outer=0;
        for(const q2 of this.nbs(q)){
          if(!this.rev.has(q2)||!this.num(q2)) continue;
          let inner=0;
          for(const p of this.nbs(q2)) if(set.has(p)&&this.unk(p)) inner++;
          outer=Math.max(outer,this.rest(q2)-inner);
        }
        if(base-outer<=0) out.push({i:q,key,lb:0,n:unk.length,v});
      }
    }
    out.sort((a,b)=>b.n-a.n);
    return out;
  }
}

function build(R,C,m,seed){
  const b=new Board(R,C,m,seed);
  b.open(b.I(Math.floor(R/2),Math.floor(C/2)));
  const snapshot=new Set(b.rev);
  const hints=[];
  for(let t=0;t<80;t++){
    if(b.solve(hints)) return {board:b,hints,snapshot,ok:true};
    const cands=b.candidates();
    let pick=null;
    for(const c of cands){ if(!hints.some(h=>h.i===c.i&&h.key===c.key)){ pick=c; break; } }
    if(!pick) return {board:b,hints,snapshot,ok:false};
    hints.push(pick);
  }
  return {board:b,hints,snapshot,ok:false};
}

function deal(R,C,m){
  for(let t=0;t<60;t++){
    const r=build(R,C,m,(Math.random()*1e9)|0);
    if(r.ok){ r.board.rev=new Set(r.snapshot); r.board.known=new Set(); r.board.dead=false; return r; }
  }
  return null;
}

function shapeHints(b){
  const out=[], used={};
  for(const q of b.rev){
    const v=b.num(q); if(!v) continue;
    const base=b.rest(q);
    let best=null;
    for(const key in SHAPES){
      const cells=b.shapeCells(q,key), set=new Set(cells);
      const unk=cells.filter(p=>b.unk(p));
      if(!unk.length) continue;
      let outside=0;
      for(const p of b.nbs(q)) if(!set.has(p)&&b.unk(p)) outside++;
      const lb=Math.max(0,base-outside);
      let outer=0;
      for(const q2 of b.nbs(q)){
        if(!b.rev.has(q2)||!b.num(q2)) continue;
        let inner=0;
        for(const p of b.nbs(q2)) if(set.has(p)&&b.unk(p)) inner++;
        outer=Math.max(outer,b.rest(q2)-inner);
      }
      const ub=Math.max(lb,base-outer);
      const exact=(lb===ub);
      if(!exact&&lb<1) continue;
      const score=(exact?100:0)+lb*10-unk.length-(used[key]||0);
      if(!best||score>best.score) best={score,key,lb,exact,n:unk.length};
    }
    if(best){ used[best.key]=(used[best.key]||0)+1; out.push({i:q,...best}); }
  }
  return out;
}
</script>
<script>
const cv = document.getElementById('board');
const ctx = cv.getContext('2d');
const msg = document.getElementById('msg');
const stat = document.getElementById('stat');
let board=null, hints=[], weak=[], cell=24, pad=0, R=16, C=30, M=100;
let startedAt=0, running=false, timer=null;

function level(){ const v=document.getElementById('level').value.split(',').map(Number); return v; }
function density(){ return Number(document.getElementById('density').value); }

function layout(){
  const maxW = Math.min(window.innerWidth - 16, 1500);
  cell = Math.max(16, Math.min(36, Math.floor(maxW / C)));
  pad = 2;
  cv.width = C*cell + pad*2;
  cv.height = R*cell + pad*2;
}

function newGame(){
  const [r,c,m] = level();
  R=r; C=c; M=m;
  msg.textContent = '生成中…';
  setTimeout(() => {
  const res = deal(R,C,M);
  if(!res){ msg.textContent='生成失败，再按一次新局'; return; }
  board = res.board; hints = res.hints;
  weak = shapeHints(board);
  startedAt = Date.now(); running = true;
  layout(); draw(); tick();
  msg.textContent = '点格子翻开，长按插旗；点已翻开的数字连开周围';
  }, 30);
}

function tick(){
  if(timer) clearInterval(timer);
  timer = setInterval(()=>{
    if(!running) return;
    stat.textContent = `剩余 ${M-board.flag.size} · ${(Date.now()-startedAt)/1000|0}s`;
  }, 250);
  stat.textContent = `剩余 ${M-board.flag.size}`;
}

function draw(){
  const s=cell;
  ctx.clearRect(0,0,cv.width,cv.height);
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const i=board.I(r,c), x=pad+c*s, y=pad+r*s;
    if(board.rev.has(i)){
      ctx.fillStyle='#f8fbfd'; ctx.fillRect(x,y,s,s);
      ctx.strokeStyle='#dbe5ee'; ctx.lineWidth=1; ctx.strokeRect(x+.5,y+.5,s-1,s-1);
      if(board.mines.has(i)){
        ctx.fillStyle='#2b3a45';
        ctx.beginPath(); ctx.arc(x+s/2,y+s/2,Math.max(3,s*0.18),0,7); ctx.fill();
        if(board.dead){ ctx.strokeStyle='#c0392b'; ctx.strokeRect(x+1,y+1,s-2,s-2); }
        continue;
      }
      const v=board.num(i);
      if(v){
        ctx.fillStyle=['','#2f6fa8','#2e7d46','#c0392b','#5b3f94','#8a5a2b','#1f7a7a','#333','#777'][v];
        ctx.font=`bold ${Math.floor(s*0.55)}px system-ui, sans-serif`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(String(v), x+s/2, y+s/2);
      }
    } else {
      ctx.fillStyle='#c9d6e2'; ctx.fillRect(x+1,y+1,s-2,s-2);
      ctx.fillStyle='#eff5fa'; ctx.fillRect(x+2,y+2,s-4,s-4);
      ctx.fillStyle='#c9d6e2'; ctx.fillRect(x+2,y+2,s-4,s-4);
      if(board.flag.has(i)){
        ctx.fillStyle='#d64045';
        ctx.beginPath();
        ctx.moveTo(x+s*0.3,y+s*0.22); ctx.lineTo(x+s*0.72,y+s*0.42);
        ctx.lineTo(x+s*0.3,y+s*0.6); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='#6b7a88'; ctx.lineWidth=Math.max(1,s*0.08);
        ctx.beginPath(); ctx.moveTo(x+s*0.28,y+s*0.22); ctx.lineTo(x+s*0.28,y+s*0.78); ctx.stroke();
      }
    }
  }
  drawHints();
  if(board.dead){
    ctx.fillStyle='rgba(0,0,0,0.10)'; ctx.fillRect(0,0,cv.width,cv.height);
  }
}

function drawHints(){
  const s=cell, lvl=density(), drawn=new Set();
  ctx.textBaseline='alphabetic';
  for(const h of weak){
    if(!board.rev.has(h.i)||drawn.has(h.i)) continue;
    if(!board.shapeCells(h.i,h.key).some(p=>!board.rev.has(p))) continue;
    if(lvl===0&&!h.exact) continue;
    if(lvl===1&&!h.exact&&h.lb<2) continue;
    const [r,c]=board.RC(h.i);
    const x=pad+c*s, y=pad+r*s;
    const txt=DISP[h.key]+h.lb;
    ctx.font=`${Math.max(7,Math.floor(s*0.28))}px system-ui, sans-serif`;
    ctx.textAlign='right';
    if(h.exact){ ctx.fillStyle='#2f6fa8'; ctx.fillText(txt, x+s-2, y+s-3); }
    else { ctx.fillStyle='#b06a00'; ctx.fillText(txt, x+s-2, y+Math.floor(s*0.32)+2); }
    drawn.add(h.i);
  }
  for(const h of hints){
    if(drawn.has(h.i)||!board.rev.has(h.i)) continue;
    const [r,c]=board.RC(h.i);
    const x=pad+c*s, y=pad+r*s;
    ctx.font=`${Math.max(7,Math.floor(s*0.28))}px system-ui, sans-serif`;
    ctx.textAlign='right'; ctx.fillStyle='#2f6fa8';
    ctx.fillText(DISP[h.key]+h.lb, x+s-2, y+s-3);
    drawn.add(h.i);
  }
}

function hit(ev){
  const rect=cv.getBoundingClientRect();
  const x=(ev.clientX-rect.left)*(cv.width/rect.width);
  const y=(ev.clientY-rect.top)*(cv.height/rect.height);
  const c=Math.floor((x-pad)/cell), r=Math.floor((y-pad)/cell);
  if(r<0||c<0||r>=R||c>=C) return null;
  return board.I(r,c);
}

function openAt(i){
  if(!board||board.dead||board.rev.has(i)||board.flag.has(i)) return;
  board.open(i);
  if(board.dead){ running=false; msg.textContent='踩到雷了 —— 按新局再来'; }
  else if(board.rev.size===R*C-M){
    running=false;
    for(const x of board.mines) board.flag.add(x);
    const sec=((Date.now()-startedAt)/1000).toFixed(1);
    const key=`best_${R}x${C}_${M}`;
    const prev=Number(localStorage.getItem(key)||0);
    const best=(!prev||sec<prev)?sec:prev;
    if(!prev||sec<prev) localStorage.setItem(key,sec);
    msg.textContent=`清完了 —— ${sec} 秒（最佳 ${best} 秒）`;
  }
  weak=shapeHints(board);
  draw(); stat.textContent=`剩余 ${M-board.flag.size} · ${((Date.now()-startedAt)/1000)|0}s`;
}

function chordAt(i){
  if(!board.rev.has(i)) return false;
  const v=board.num(i); if(!v) return false;
  let f=0; for(const p of board.nbs(i)) if(board.flag.has(p)) f++;
  if(f!==v){
    const t=weak.find(h=>h.i===i);
    msg.textContent = t ? `R${Math.floor(i/C)+1}C${i%C+1} 数字 ${v}：${t.exact?'共有':'至少'} ${DISP[t.key]}${t.lb} 颗` : `R${Math.floor(i/C)+1}C${i%C+1} 数字 ${v}`;
    return true;
  }
  for(const p of board.nbs(i)) if(!board.rev.has(p)&&!board.flag.has(p)) board.open(p);
  if(board.dead){ running=false; msg.textContent='踩到雷了 —— 按新局再来'; }
  else if(board.rev.size===R*C-M){ running=false; msg.textContent='清完了'; }
  weak=shapeHints(board); draw();
  return true;
}

let pressTimer=null, pressCell=null, longFired=false;

cv.addEventListener('pointerdown', ev=>{
  if(!board) return;
  const i=hit(ev); if(i===null) return;
  pressCell=i; longFired=false;
  pressTimer=setTimeout(()=>{
    longFired=true;
    if(!board.rev.has(i)){ board.flag.has(i)?board.flag.delete(i):board.flag.add(i); draw(); }
  }, 420);
});
cv.addEventListener('pointerup', ev=>{
  clearTimeout(pressTimer);
  if(!board||longFired) return;
  const i=hit(ev); if(i===null) return;
  if(board.rev.has(i)) chordAt(i);
  else openAt(i);
});
cv.addEventListener('pointercancel', ()=>clearTimeout(pressTimer));
cv.addEventListener('contextmenu', ev=>ev.preventDefault());

document.getElementById('newgame').onclick=newGame;
document.getElementById('level').onchange=newGame;
document.getElementById('density').onchange=()=>draw();
window.addEventListener('resize',()=>{ layout(); draw(); });
newGame();
</script>
</body>
</html>
